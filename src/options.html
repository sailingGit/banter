<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Banter</title>
    <style>
      body { max-width: 460px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; }
      [hidden] { display: none !important; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input, select, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 9px; font: inherit; }
      small { color: #666; font-weight: 400; }
      button { margin-top: 20px; padding: 7px 16px; font: inherit; }
    </style>
  </head>
  <body>
    <h1 data-i18n="options.title"></h1>
    <label>
      OpenAI API Key
      <input id="openaiKey" type="password" autocomplete="off" />
      <small data-i18n="options.openaiHelp"></small>
    </label>
    <label>
      <span data-i18n="options.nativeLanguage"></span>
      <select id="nativeLanguage"></select>
      <small data-i18n="options.nativeLanguageHelp"></small>
    </label>
    <label>
      <span data-i18n="options.replyProvider"></span>
      <select id="replyProvider">
        <option value="openai">OpenAI (gpt-6-luna)</option>
        <option value="custom" data-i18n="options.custom"></option>
      </select>
    </label>
    <label data-provider="custom">
      <span data-i18n="options.baseUrl"></span>
      <input id="customBaseUrl" placeholder="https://api.example.com/v1" />
      <small data-i18n="options.baseUrlHelp"></small>
    </label>
    <label data-provider="custom">
      API Key
      <input id="customKey" type="password" autocomplete="off" />
      <small data-i18n="options.customKeyHelp"></small>
    </label>
    <label data-provider="custom">
      <span data-i18n="options.model"></span>
      <input id="customModel" data-i18n-placeholder="options.modelPlaceholder" />
    </label>
    <label data-provider="custom">
      <span data-i18n="options.format"></span>
      <select id="customFormat">
        <option value="json_schema" data-i18n="options.formatSchema"></option>
        <option value="json_object">json_object</option>
        <option value="none" data-i18n="options.formatNone"></option>
      </select>
      <small data-i18n="options.formatHelp"></small>
    </label>
    <label data-provider="custom">
      <span data-i18n="options.reasoning"></span>
      <select id="customReasoning">
        <option value="" data-i18n="options.reasoningOff"></option>
        <option value="none">none</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
      </select>
      <small data-i18n="options.reasoningHelp"></small>
    </label>
    <label>
      <span data-i18n="options.profile"></span>
      <textarea id="profile" rows="4" data-i18n-placeholder="options.profilePlaceholder"></textarea>
      <small data-i18n="options.profileHelp"></small>
    </label>
    <label>
      <span data-i18n="options.level"></span>
      <select id="level">
        <option value="intermediate" data-i18n="options.intermediate"></option>
        <option value="beginner" data-i18n="options.beginner"></option>
        <option value="advanced" data-i18n="options.advanced"></option>
      </select>
    </label>
    <label>
      <span data-i18n="options.languages"></span>
      <input id="languages" data-i18n-placeholder="options.languagesPlaceholder" />
      <small data-i18n="options.languagesHelp"></small>
    </label>
    <button id="save" data-i18n="options.save"></button>
    <span id="saved"></span>
    <p><small data-i18n="options.footer"></small></p>
    <script src="options.js"></script>
  </body>
</html>
